# ─────────────────────────────────────────────────────────────────────────────
# Place this file in your PROFILE repo (the one named exactly "devjeje"):
#   devjeje/devjeje/.github/workflows/gitworld.yml
#
# README already points at:
#   https://raw.githubusercontent.com/devjeje/devjeje/main/dist/gitworld.svg
# ─────────────────────────────────────────────────────────────────────────────

name: GitWorld — Update Profile

on:
  schedule:
    - cron: '0 18 * * *'   # runs daily at 18:00 UTC
  workflow_dispatch:        # allow manual trigger from the Actions tab

jobs:
  gitworld:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate GitWorld SVG + Profile Card
        uses: Dasmat13/git-world-action@main
        with:
          github_user_name: ${{ github.actor }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          svg_out_path: dist/gitworld.svg
          # city biome is auto-picked from your top language

      - name: Commit & push SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/gitworld.svg dist/profile-card.svg
          git diff --cached --quiet || git commit -m "🌍 Update GitWorld [$(date +'%Y-%m-%d')]"
          git push
